#       DOK 1 : Recall or identify a fact, formula, or concept directly from the context. Single-step, straightforward.

#       DOK 2 : Requires **indirect or multi-step application** of formulas, patterns, or procedures. Students must:
#         - Use previously derived information or intermediate results,
#         - Connect two or more variables or concepts, and
#         - Perform **at least two distinct logical or computational steps**.
#         Problems should **not be solvable by a single formula**; they should require reasoning or linking information.

#             DOK 3 – Advanced Reasoning & High Difficulty


#         DOK 3 questions must require advanced reasoning through constraints or multi-step planning within the scenario. They should be intellectually challenging — solvable only by a well-prepared or advanced student, not by routine formula substitution.
#         They should feel like real problem-solving, not just comparison or explanation tasks.

#           A DOK 3 question must:

#           ✔ Involve a goal with conditions or limitations 
#             – e.g., exact value, minimum cost, limited resources, maximum number, least wastage, time limits, efficiency.

#           ✔ Require multiple reasoning steps and decision-making:
#             – students must choose a strategy (not directly given),
#             – may involve testing combinations, planning step-by-step, or optimizing.

#           ✔ Be solvable using only information allowed by the scenario (no outside knowledge), 
#             but may introduce **realistic additional constraints** that make the problem harder.

#           ✔ Lead to one or more mathematically correct solutions using logic, not opinion or descriptive justification.

#           ✔ Not end after a simple calculation. The student should:
#             - interpret data → plan → apply constraints → compute → check feasibility.

#           ⚠ A DOK 3 question does **not have to ask “Which is better and why?”.** 
#           It can be purely computational but complex, like:
#             “What is the maximum number of large tents that can be built given fabric limits, cost constraints, and minimum safety distance rules?”

#           ✔ Final answers can be numbers, a plan, or a combination (e.g., number of packs + total time).

#           Answer Key Requirement:
#             Logical-operation sequence (DOK 3): [Interpret constraints → Form equations/plans → Test or optimize → Final answer].
                  
#           The student must make a justified judgement, not just compute.

#           - **High Cognitive Demand**
#             - Should be challenging even for top students (Olympiad/NTSE-level within that grade).
#             - Cannot be solved through memorized formulas or direct substitution.
