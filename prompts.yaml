#   📌 DUPLICATE-PREVENTION RULE 

#       When generating CBS questions, you must ensure zero duplicates, including near-duplicates.
#       A near-duplicate is when two questions share similar:

#       • DOK structure
#       • reasoning steps
#       • operation pattern (e.g., convert → add → compare)
#       • decimal skill (e.g., repeated place-value questions)
#       • optimization tasks (best fit, closest, maximum, minimum)
#       • contexts (canteen, money, shopping, travel, sports, measurement, liquids, tape/rulers, etc.)
#       • diagram format (ruler, price list, tables, strips, grids, jugs/cups, etc.)

#       To avoid this, every CBS question must:

#       • Use a different real-life context category.
#       • Use a different diagram type.
#       • Use a different DOK-3 reasoning pattern (no repeated “choose the best combination under a limit”).
#       • Use different mathematical operations across questions (not all addition, not all conversion, not all comparison).
