#       - It should be at least four lines long and flow smoothly with clear connections between sentences.
#       - Avoid abrupt or mechanical data statements — the narrative must feel natural and meaningful.
#       - If the question includes options (multiple-choice format), ensure that the options are naturally integrated into the given scenario. Avoid listing them abruptly as “Option A, Option B,” etc., without contextual relevance to the case or situation.
#       - The values and units used in the scenario should be realistic, accurate, and measurable in real-life situations. Only use proper numbers that lead to clean, finite, and practical results (no irrational or overly complex values) for scenarios only .
