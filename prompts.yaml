      • Use a different diagram type.
      • Use a different DOK-3 reasoning pattern (no repeated “choose the best combination under a limit”).
      • Use different mathematical operations across questions (not all addition, not all conversion, not all comparison).
      • Use different decimal sub-skills across DOK-1 and DOK-2 (place value, ordering, converting, writing decimals, interpreting decimals, comparing decimals, etc.).

      If any question accidentally resembles another in structure, theme, or logic, regenerate it using a new pattern.

  Difficulty adjustment:

    For example, if a Grade 10 question uses the old formula for volume of a cylinder, the question should require application in a more complex scenario — like combining multiple solids, removing carved portions, or converting solids — so it is worth a mark at Grade 10.


